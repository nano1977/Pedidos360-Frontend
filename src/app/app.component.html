<div style="padding: 20px; font-family: Arial, sans-serif;">
  <h2>Integración Pedidos360 (Angular + Azure PostgreSQL)</h2>

  <!-- Estado de Sesión -->
  <div *ngIf="isLoggedIn(); else loginBlock" style="margin-top: 20px; margin-bottom: 20px;">
    <p style="color: #2e7d32; font-weight: bold;">
      ✓ Usuario activo: {{ obtenerUsuario() }}
    </p>

    <div style="display: flex; gap: 10px; margin-top: 15px;">
      <button 
        (click)="probarConexion()" 
        style="background-color: #1b5e20; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
        Probar conexión con Backend Spring Boot
      </button>

      <button 
        (click)="cerrarSesion()" 
        style="background-color: #b71c1c; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
        Cerrar Sesión
      </button>
    </div>
  </div>

  <ng-template #loginBlock>
    <p style="color: #555; margin-top: 20px;">Debes iniciar sesión para probar la conexión con la API.</p>
    <button 
      (click)="iniciarSesion()" 
      style="background-color: #0d47a1; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
      Iniciar Sesión con Azure AD
    </button>
  </ng-template>

  <!-- Panel de Respuesta Exitosa -->
  <div *ngIf="respuestaBackend" style="margin-top: 20px; padding: 15px; background-color: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 5px;">
    <h3 style="color: #1b5e20; margin-top: 0;">Respuesta Exitosa del Backend:</h3>
    <pre style="background: #ffffff; padding: 10px; border-radius: 4px; border: 1px solid #ddd;">{{ respuestaBackend | json }}</pre>
  </div>

  <!-- Panel de Error -->
  <div *ngIf="errorMensaje" style="margin-top: 20px; padding: 15px; background-color: #ffebee; border: 1px solid #ef9a9a; border-radius: 5px; color: #c62828;">
    <h3 style="margin-top: 0;">Error de Conexión:</h3>
    <p style="margin-bottom: 0;">{{ errorMensaje }}</p>
  </div>
</div>
