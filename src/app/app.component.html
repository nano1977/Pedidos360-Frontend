<div style="padding: 30px; font-family: Arial, sans-serif;">
  <h2>Integración Pedidos360 (Angular + Azure PostgreSQL)</h2>

  <div *ngIf="respuestaBackend" style="background-color: #e8f5e9; border: 1px solid #4caf50; padding: 20px; border-radius: 8px;">
    <h3 style="color: #2e7d32; margin-top: 0;">¡Conexión Exitosa con Spring Boot!</h3>
    <p><strong>Estado:</strong> {{ respuestaBackend.status }}</p>
    <p><strong>Mensaje:</strong> {{ respuestaBackend.mensaje }}</p>
    <p><strong>Usuario:</strong> {{ respuestaBackend.usuario }}</p>
    <p><strong>Tenant:</strong> {{ respuestaBackend.tenant }}</p>
  </div>

  <div *ngIf="errorMensaje" style="background-color: #ffebee; border: 1px solid #f44336; padding: 20px; border-radius: 8px;">
    <h3 style="color: #c62828; margin-top: 0;">Error de Conexión</h3>
    <p>{{ errorMensaje }}</p>
  </div>
</div>
